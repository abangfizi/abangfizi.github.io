<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal Utility</title>
    <script src="//unpkg.com/alpinejs" defer></script>
    <link rel="manifest" href="manifest.json" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-gray-100 p-6 relative" x-data="carApp()">
    <!-- Alert sukses -->
    <div
      x-show="loginConfig.showSuccess"
      x-transition
      class="absolute flex items-center gap-2 p-4 mb-4 right-0 text-sm text-blue-800 rounded-lg bg-blue-100"
      role="alert"
      style="display: none"
    >
      <span class="font-medium">Login Berhasil</span>
      <button @click="loginConfig.showSuccess = false">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="size-6"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M6 18 18 6M6 6l12 12"
          />
        </svg>
      </button>
    </div>

    <!-- Alert gagal -->
    <div
      x-show="loginConfig.showFailed"
      x-transition
      class="absolute flex items-center gap-2 p-4 mb-4 right-0 text-sm text-red-800 rounded-lg bg-red-100"
      role="alert"
      style="display: none"
    >
      <span class="font-medium" x-text="loginConfig.errorMessage"></span>
      <button @click="loginConfig.showFailed = false">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="size-6"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M6 18 18 6M6 6l12 12"
          />
        </svg>
      </button>
    </div>

    <!-- Form Login (muncul jika belum ada token) -->
    <template x-if="!token">
      <div class="mb-4 p-4 bg-white rounded shadow">
        <label class="block mb-2 font-semibold">Email</label>
        <input x-model="email" type="email" class="border p-2 w-full mb-2" />

        <label class="block mb-2 font-semibold">Password</label>
        <input
          x-model="password"
          type="password"
          class="border p-2 w-full mb-2"
        />

        <button
          @click="login()"
          class="bg-blue-500 text-white px-4 py-2 rounded flex items-center gap-2"
        >
          <div
            role="status"
            x-show="loginConfig.isLoading"
            style="display: none"
          >
            <svg
              aria-hidden="true"
              class="w-5 h-5 animate-spin"
              viewBox="0 0 100 101"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M100 50.5908C100 78.2051 77.6142 100.591 50 100.591C22.3858 100.591 0 78.2051 0 50.5908C0 22.9766 22.3858 0.59082 50 0.59082C77.6142 0.59082 100 22.9766 100 50.5908ZM9.08144 50.5908C9.08144 73.1895 27.4013 91.5094 50 91.5094C72.5987 91.5094 90.9186 73.1895 90.9186 50.5908C90.9186 27.9921 72.5987 9.67226 50 9.67226C27.4013 9.67226 9.08144 27.9921 9.08144 50.5908Z"
                fill="currentColor"
              />
              <path
                d="M93.9676 39.0409C96.393 38.4038 97.8624 35.9116 97.0079 33.5539C95.2932 28.8227 92.871 24.3692 89.8167 20.348C85.8452 15.1192 80.8826 10.7238 75.2124 7.41289C69.5422 4.10194 63.2754 1.94025 56.7698 1.05124C51.7666 0.367541 46.6976 0.446843 41.7345 1.27873C39.2613 1.69328 37.813 4.19778 38.4501 6.62326C39.0873 9.04874 41.5694 10.4717 44.0505 10.1071C47.8511 9.54855 51.7191 9.52689 55.5402 10.0491C60.8642 10.7766 65.9928 12.5457 70.6331 15.2552C75.2735 17.9648 79.3347 21.5619 82.5849 25.841C84.9175 28.9121 86.7997 32.2913 88.1811 35.8758C89.083 38.2158 91.5421 39.6781 93.9676 39.0409Z"
                fill="currentFill"
              />
            </svg>
            <span class="sr-only">Loading...</span>
          </div>
          <p>Login</p>
        </button>
      </div>
    </template>

    <!-- Tombol Hapus Token (muncul jika sudah login) -->
    <template x-if="token">
      <div class="mb-4 p-4 bg-white rounded shadow flex flex-wrap gap-2">
        <button
          @click="clearToken()"
          class="bg-red-500 text-white px-4 py-2 rounded"
        >
          Hapus Token
        </button>
        <a
          href="/script-check-website.html"
          target="_blank"
          class="bg-purple-500 text-white px-4 py-2 rounded"
        >
          Check My Website
        </a>
        <a
          href="/generator.html"
          class="bg-blue-500 text-white px-4 py-2 rounded"
        >
          Kirim Data
        </a>
        <a
          href="/scanner.html"
          class="bg-green-500 text-white px-4 py-2 rounded"
        >
          Terima Data
        </a>
      </div>
    </template>
  </body>

  <script>
    function carApp() {
      return {
        email: "",
        password: "",
        token: null,
        loginConfig: {
          isLoading: false,
          errorMessage: "",
          showSuccess: false,
          showFailed: false,
        },

        init() {
          this.token = localStorage.getItem("token");
        },

        async login() {
          this.loginConfig.isLoading = true;

          try {
            const response = await fetch(
              "https://www.auto88group.com/api/login",
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  Accept: "application/json",
                },
                body: JSON.stringify({
                  email: this.email,
                  password: this.password,
                  token: "-",
                  from: "web",
                }),
              },
            );

            const data = await response.json();

            if (!response.ok || !data.success) {
              throw new Error(data.message || "Login gagal");
            }

            // simpan token
            this.token = data.token;
            localStorage.setItem("token", data.token);

            this.loginConfig.showSuccess = true;
            setTimeout(() => (this.loginConfig.showSuccess = false), 1500);
          } catch (error) {
            console.error(error);
            this.loginConfig.errorMessage =
              error.message || "Terjadi kesalahan";
            this.loginConfig.showFailed = true;
            setTimeout(() => (this.loginConfig.showFailed = false), 2000);
          } finally {
            this.loginConfig.isLoading = false;
          }
        },

        clearToken() {
          localStorage.removeItem("token");
          this.token = null;
        },
      };
    }
  </script>
</html>
