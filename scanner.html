<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Terima Data</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <div id="app">
      <a href="/" class="block text-center text-sm text-blue-600 underline mt-4"
        >&larr; Kembali</a
      >
      <div class="flex flex-col w-full items-center justify-center">
        <div class="text-xl my-4">Mode Terima Data</div>
        <div class="text-sm mb-2 text-center">{{ msg }}</div>
        <div class="text-sm mb-2">
          Diterima: {{ received }} / {{ total || 0 }} ({{ pct.toFixed(0) }}%)
        </div>
        <div class="w-64 h-2 bg-gray-200 mb-4">
          <div class="h-2 bg-green-500" :style="{ width: pct + '%' }"></div>
        </div>
        <button
          v-if="!receiving"
          @click="start"
          class="mb-6 p-1 border-2 border-gray-500"
        >
          Mulai Terima
        </button>
        <button
          v-else
          @click="stop(false)"
          class="mb-6 p-1 border-2 border-gray-500"
        >
          Berhenti
        </button>
        <video
          id="videoElement"
          class="w-full max-w-md"
          muted
          autoplay
          playsinline
        ></video>
      </div>
    </div>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@undecaf/zbar-wasm@latest/dist/index.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.0.3/pako.min.js"></script>
    <script>
      const { createApp, ref, computed } = Vue;

      createApp({
        setup() {
          const IDLE =
            "Tekan Mulai Terima, lalu arahkan kamera ke layar pengirim";
          const msg = ref(IDLE);
          const receiving = ref(false);
          const received = ref(0);
          const total = ref(0);
          const name = ref("");
          const pct = computed(() =>
            total.value ? (received.value / total.value) * 100 : 0,
          );

          let chunks = [],
            sid = null,
            stream = null,
            token = 0;
          let video, canvas, ctx;

          const resetData = () => {
            chunks = [];
            received.value = 0;
            total.value = 0;
            name.value = "";
            sid = null;
          };
          const toBytes = (b64) => {
            const bin = atob(b64);
            const u = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
            return u;
          };

          const handle = (text) => {
            const p = text.split("|");
            if (p[0] !== "M" && p[0] !== "D") return;
            if (sid !== p[1]) {
              resetData();
              sid = p[1];
            } // sesi baru dari pengirim
            if (p[0] === "M" && p.length >= 4) {
              total.value = +p[2];
              name.value = decodeURIComponent(p[3]);
            } else if (p[0] === "D" && p.length === 5) {
              const i = +p[2];
              total.value = +p[3];
              if (!chunks[i]) {
                chunks[i] = toBytes(p[4]);
                received.value++;
              }
            }
          };

          const finish = () => {
            let len = 0;
            for (let i = 0; i < total.value; i++) len += chunks[i].length;
            const all = new Uint8Array(len);
            let off = 0;
            for (let i = 0; i < total.value; i++) {
              all.set(chunks[i], off);
              off += chunks[i].length;
            }
            const blob = new Blob([pako.inflate(all)]);
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = name.value || `file-${sid}`;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
              URL.revokeObjectURL(a.href);
              a.remove();
            }, 1000);
            stop(true);
            msg.value = "Transfer selesai, file diunduh";
          };

          const stop = (keepMsg) => {
            token++;
            receiving.value = false;
            if (stream) stream.getTracks().forEach((t) => t.stop());
            stream = null;
            if (!keepMsg) {
              msg.value = IDLE;
              resetData();
            }
          };

          const loop = async (id) => {
            while (id === token) {
              if (video.readyState >= 2 && video.videoWidth) {
                // perkecil gambar agar scan jauh lebih cepat
                const k = Math.min(1, 800 / video.videoWidth);
                const w = Math.round(video.videoWidth * k),
                  h = Math.round(video.videoHeight * k);
                if (canvas.width !== w) {
                  canvas.width = w;
                  canvas.height = h;
                }
                ctx.drawImage(video, 0, 0, w, h);
                try {
                  const syms = await zbarWasm.scanImageData(
                    ctx.getImageData(0, 0, w, h),
                  );
                  for (const sym of syms) handle(sym.decode());
                } catch (e) {
                  console.error(e);
                }
                if (
                  id === token &&
                  total.value > 0 &&
                  received.value === total.value &&
                  name.value
                ) {
                  finish();
                  return;
                }
              }
              await new Promise((r) => requestAnimationFrame(r));
            }
          };

          const start = async () => {
            try {
              resetData();
              video = document.getElementById("videoElement");
              canvas = document.createElement("canvas");
              ctx = canvas.getContext("2d", { willReadFrequently: true });
              stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "environment" },
              });
              video.srcObject = stream;
              await video.play();
              receiving.value = true;
              msg.value =
                "Menerima data ... biarkan kamera tetap mengarah ke layar pengirim";
              loop(++token);
            } catch (e) {
              msg.value = "Gagal membuka kamera: " + e.message;
            }
          };

          return { msg, receiving, received, total, pct, start, stop };
        },
      }).mount("#app");
    </script>
  </body>
</html>
