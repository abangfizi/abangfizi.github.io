<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>Fetch Terminal Log</title>
    <style>
      body {
        background: #000;
        color: #00ff6a;
        font-family: "Courier New", monospace;
        padding: 20px;
      }
      .terminal {
        width: 100%;
        max-width: 800px;
        height: 300px;
        background: #000;
        border: 1px solid #00ff6a;
        padding: 10px;
        overflow-y: auto;
        box-shadow: 0 0 10px rgba(0, 255, 106, 0.4);
      }
      .log {
        line-height: 1.4;
        white-space: pre-wrap;
      }
      .success {
        color: #00ff6a;
      }
      .error {
        color: #ff4d4d;
      }
      .info {
        color: #00e5ff;
      }
      button {
        background: #000;
        border: 1px solid #00ff6a;
        color: #00ff6a;
        padding: 6px 12px;
        cursor: pointer;
        margin-bottom: 10px;
      }
      button:hover {
        background: #00ff6a;
        color: #000;
      }
    </style>
  </head>
  <body>
    <h3>🖥️ Fetch Terminal</h3>
    <button onclick="requestNotifPermission()">
      Aktifkan Browser Notification
    </button>

    <div id="terminal" class="terminal">
      <div id="log" class="log"></div>
    </div>

    <script>
      let intervalId = null;
      const logEl = document.getElementById("log");
      const terminalEl = document.getElementById("terminal");

      /* ===============================
         TERMINAL LOG
      =============================== */
      function logMessage(message, type = "success") {
        const time = new Date().toLocaleTimeString();
        const line = document.createElement("div");
        line.className = type;
        line.textContent = `[${time}] ${message}`;
        logEl.appendChild(line);
        terminalEl.scrollTop = terminalEl.scrollHeight;
      }

      /* ===============================
         SERVICE WORKER REGISTER
      =============================== */
      async function registerSW() {
        if (!("serviceWorker" in navigator)) {
          logMessage("Service Worker tidak didukung browser ini", "error");
          return;
        }
        try {
          const reg = await navigator.serviceWorker.register("/sw.js");
          logMessage("Service Worker registered ✓", "success");

          // Tunggu SW benar-benar aktif
          await navigator.serviceWorker.ready;
          logMessage("Service Worker ready ✓", "success");
        } catch (err) {
          logMessage("Service Worker error: " + err.message, "error");
        }
      }

      /* ===============================
         BROWSER NOTIFICATION
      =============================== */
      async function requestNotifPermission() {
        if (!("Notification" in window)) {
          logMessage("Notifikasi tidak didukung", "error");
          return;
        }
        const permission = await Notification.requestPermission();
        if (permission === "granted") {
          logMessage("Notifikasi diizinkan ✓", "success");
        } else {
          logMessage("Notifikasi ditolak", "error");
        }
      }

      async function showNotification(title, body) {
        if (!("Notification" in window)) return;
        if (Notification.permission !== "granted") {
          logMessage("Notif skip: belum ada izin", "info");
          return;
        }
        try {
          // ✅ Putar sound manual sebelum notif
          const audio = new Audio("/error-notif.mp3");
          audio.play().catch(() => {}); // catch jika autoplay diblokir browser

          const reg = await navigator.serviceWorker.ready;
          await reg.showNotification(title, {
            body,
            icon: "/icon.png",
            badge: "/icon.png",
            vibrate: [200, 100, 200],
            tag: "fetch-status",
            renotify: true,
            requireInteraction: true,
            silent: false,
            timestamp: Date.now(),
            data: { url: "/script-check-website.html" },
            actions: [
              { action: "buka", title: "Buka App" },
              { action: "tutup", title: "Tutup" },
            ],
          });
          logMessage(`Notif terkirim: ${title}`, "info");
        } catch (err) {
          logMessage("Notif error: " + err.message, "error");
        }
      }

      /* ===============================
         FETCH + TIMEOUT
      =============================== */
      async function fetchWithTimeout() {
        logMessage("Requesting data...", "info");

        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 5000);

        try {
          const token = localStorage.getItem("token");
          if (!token) {
            logMessage("Token tidak ditemukan", "error");
            clearTimeout(timeoutId);
            stopInterval();
            return;
          }

          const response = await fetch(
            "https://www.auto88group.com/api/profile",
            {
              headers: {
                Accept: "application/json",
                Authorization: `Bearer ${token}`,
              },
              signal: controller.signal,
            },
          );

          clearTimeout(timeoutId);

          if (!response.ok) throw new Error("Response error");

          await response.text();
          logMessage("Fetch success ✓", "success");
          startInterval();
        } catch (error) {
          clearTimeout(timeoutId);

          if (error.name === "AbortError") {
            logMessage("Timeout (>5 detik)", "error");
            showNotification("Fetch Timeout", "Request melebihi 5 detik");
          } else {
            logMessage("Fetch error: " + error.message, "error");
            showNotification("Fetch Error", "Gagal mengambil data dari server");
          }

          stopInterval();
        }
      }

      /* ===============================
         INTERVAL CONTROL
      =============================== */
      function startInterval() {
        if (intervalId) return;
        logMessage("Start auto fetch (30s)", "info");
        intervalId = setInterval(() => fetchWithTimeout(), 30000);
      }

      function stopInterval() {
        if (intervalId) {
          clearInterval(intervalId);
          intervalId = null;
          logMessage("Auto fetch stopped", "error");
        }
      }

      /* ===============================
         INIT — urutan penting!
      =============================== */
      registerSW().then(() => {
        fetchWithTimeout(); // jalankan fetch setelah SW siap
      });
    </script>
  </body>
</html>
